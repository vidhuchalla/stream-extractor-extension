<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; font-family: Arial, sans-serif; padding: 10px; margin: 0; background: #f9f9f9; }
    h3 { margin-top: 0; color: #333; font-size: 14px; }
    .stream-item { 
      background: #fff; border: 1px solid #ddd; padding: 8px; margin-bottom: 6px; 
      border-radius: 4px; word-break: break-all; font-size: 11px;
    }
    button { 
      background: #007bff; color: #fff; border: none; padding: 5px 10px; 
      border-radius: 3px; cursor: pointer; margin-top: 4px; width: 100%;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h3>Detected Video Streams</h3>
  <div id="streams-list">Searching for media streams...</div>
  <script src="popup.js"></script>
</body>
</html>
